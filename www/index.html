<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Utos ni Mama RPG</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="game-container">
      <!-- START SCREEN -->
      <div id="screen-start" class="screen active">
        <div class="tv-stage">
          <!-- The White Inner Screen Area of the TV -->
          <div class="tv-screen-area">
            <img id="title-logo" src="images/logo-name.png" alt="Utos ni Mama" />
            <img id="title-mama" src="images/mama.png" alt="Mama" />
            
            <!-- Embedded Name Input -->
            <div id="title-input-wrapper">
              <input
                type="text" id="name-input" placeholder="Hello, what's your name?"
                maxlength="12" autocomplete="off"
              />
            </div>
          </div>

          <!-- Remote on bottom-right table -->
          <div id="remote-control">
            <img id="remote-img" src="images/remote.png" alt="Remote" />
            <!-- Red remote button layered on top -->
             <p id="remote-instruction">PRESS TO START</p>
            <button
              id="remote-power-btn" title="Start Quest" 
              onclick="startGame()" aria-label="Start Quest"
            ></button>
          </div>
        </div>
      </div>

      <!-- SELECT MENU -->
      <div id="screen-menu" class="screen">
        <div id="top-left-controls">
          <button onclick="playAllShuffled()" id="play-all-btn">▶ PLAY ALL</button>
          <button onclick="shuffleAndReloadMenu()" id="shuffle-btn">🔀 SHUFFLE</button>
        </div>
        <button onclick="openStats()" id="stats-btn">📊 STATS</button>

        <h1>MGA UTOS</h1>
        <p>Choose a task from Mama:</p>
        <div id="quest-grid"></div>
        <button onclick="resetToStart()" class="back-btn">BACK TO TITLE</button>
      </div>

      <!-- STATS SCREEN -->
      <div id="screen-stats" class="screen">
        <h1>REPORT CARD</h1>
        <p>Session Mistake Tracker</p>
        <div id="global-stats" class="stats-box"></div>
        <button onclick="clearHistory()" style="background-color: #c0392b">
          🗑️ CLEAR HISTORY
        </button>
        <button onclick="resetToMenu()">BACK TO MENU</button>
      </div>

      <!-- GAME SCREEN -->
      <div id="screen-game" class="screen">
        <div id="hud">
          <span id="level-title">Quest 1</span>
          <span id="hearts-display">❤️❤️❤️</span>

          <!--Timer-->
          <div id="time-container">
            <div id="timer-wrapper">
              <div id="liquid-bounds">
                <div id="time-liquid"></div>
              </div>
              <img src="images/timer-pic.png" id="timer-graphic" />
            </div>
            <span id="timer" class="pulse-anim"> 15s</span>
          </div>
          <button onclick="resetToMenu()" id="Exit">Exit</button>
        </div>

        <!-- Pop-up Mama Reaction Container for In-Game Answers -->
        <div id="mama-feedback-popup" class="hidden">
          <img id="mama-feedback-img" src="" alt="Mama Reaction" />
        </div>

        <div class="pixel-sprite bounce-anim" id="character-sprite">👩‍🦱</div>

        <div id="dialog-box">
          <p id="scenario-text">Loading...</p>
          <p id="question-text" class="highlight"></p>
        </div>

        <div id="options-container"></div>
        <div id="input-container">
          <input
            type="text"
            id="spelling-input"
            placeholder="Type here..."
            autocomplete="off"
            onkeypress="if (event.key === 'Enter') checkSpelling();"
          />
          <button onclick="checkSpelling()">SUBMIT</button>
        </div>
      </div>

      <!-- GAME OVER SCREEN -->
      <div id="screen-gameover" class="screen">
        <h1 class="shake-anim">LAGOT KA KAY MAMA!</h1>
        <p id="gameover-reason"></p>
        <img src="images/mama-gameover.png"
          id="mama-gameover"
          onerror="this.style.display = 'none'"
        />
        <button onclick="resetToMenu()">BACK TO MENU</button>
      </div>

      <!-- VICTORY SCREEN -->
      <div id="screen-victory" class="screen">
        <h1>GOOD JOB, ANAK!</h1>
        <p>You survived Mama's tasks.</p>
        <img src="images/mama-happy.png"
          id="mama-happy"
          onerror="this.style.display = 'none'"
        />
        <button onclick="resetToMenu()">BACK TO MENU</button>
      </div>

      <div id="notification-box" style="display: none"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
